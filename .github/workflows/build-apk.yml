name: Build & Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies & Build Web App
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Prepare Android Project (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            echo "Wrapping Web App into Android native project..."
            npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
            npx cap init "JualRugi" "id.jualrugi.app" --web-dir dist
            npx cap add android
          else
            echo "Syncing existing Android project..."
            npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps || true
            npx cap sync android || true
          fi

      - name: Copy App Icons into Android Project
        run: |
          if [ -d "android/app/src/main/res" ]; then
            echo "Copying launcher icons to Android res directories..."
            if [ -f "public/pwa-512x512.png" ]; then
              mkdir -p android/app/src/main/res/mipmap-xxxhdpi
              cp public/pwa-512x512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              cp public/pwa-512x512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            fi
            if [ -f "public/pwa-192x192.png" ]; then
              mkdir -p android/app/src/main/res/mipmap-xxhdpi
              cp public/pwa-192x192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
              cp public/pwa-192x192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
            fi
          fi

      - name: Build Android Debug APK
        run: |
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
            cd ..
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            echo "Error: No Android build directory found"
            exit 1
          fi

      - name: Locate & Verify Built APK
        id: find_apk
        run: |
          FOUND_APK=$(find . -path "*/build/outputs/apk/debug/*-debug.apk" | head -n 1)
          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "Searching all APKs..."
            find . -name "*.apk"
            echo "Error: Debug APK could not be found."
            exit 1
          fi
          echo "Found APK at: $FOUND_APK"
          TMP_DIR=$(mktemp -d)
          cp "$FOUND_APK" "$TMP_DIR/app-debug.apk"
          echo "apk_path=$TMP_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="${{ steps.find_apk.outputs.apk_path }}"
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          gh release create "$TAG_NAME" "$ASSET#app-debug.apk" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "### Automated Debug APK Build
          - **App:** JualRugi.id Android App
          - **Run Number:** ${{ github.run_number }}
          - **Commit:** ${{ github.sha }}
          - **Status:** Berhasil di-build dari Web App menjadi Native Android APK."

      - name: Report APK download result
        if: always()
        run: |
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
          echo "### 📱 DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
          echo "[$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact backup 'app-debug-apk' juga tersedia di tab Actions." >> "$GITHUB_STEP_SUMMARY"
