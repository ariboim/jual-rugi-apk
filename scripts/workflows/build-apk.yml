name: Build & Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Ensure Android Project Files
        run: |
          mkdir -p android/app/src/main/java/id/jualrugi/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/layout
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          # 1. settings.gradle
          cat << 'EOF' > android/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JualRugi"
          include ':app'
          EOF

          # 2. build.gradle
          cat << 'EOF' > android/build.gradle
          plugins {
              id 'com.android.application' version '8.6.0' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > android/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'id.jualrugi.app'
              compileSdk 34

              defaultConfig {
                  applicationId "id.jualrugi.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.webkit:webkit:1.10.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="JualRugi.my.id"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.JualRugi"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 6. strings.xml & styles.xml
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">JualRugi.my.id</string>
          </resources>
          EOF

          cat << 'EOF' > android/app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.JualRugi" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="android:statusBarColor">#ffffff</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          # 7. activity_main.xml
          cat << 'EOF' > android/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.swiperefreshlayout.widget.SwipeRefreshLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/swipeRefresh"
              android:layout_width="match_parent"
              android:layout_height="match_parent">
              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
          EOF

          # 8. MainActivity.java
          cat << 'EOF' > android/app/src/main/java/id/jualrugi/app/MainActivity.java
          package id.jualrugi.app;

          import android.annotation.SuppressLint;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.activity.OnBackPressedCallback;
          import androidx.annotation.Nullable;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private SwipeRefreshLayout swipeRefresh;
              private ValueCallback<Uri[]> uploadMessage;
              private static final int FILE_CHOOSER_RESULT_CODE = 1001;
              private static final String APP_URL = "https://jual-rugi-apk.vercel.app";

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  swipeRefresh = findViewById(R.id.swipeRefresh);
                  webView = findViewById(R.id.webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setUseWideViewPort(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();
                          if ("whatsapp".equals(scheme) || "tel".equals(scheme) || "mailto".equals(scheme)) {
                              try {
                                  Intent intent = new Intent(Intent.ACTION_VIEW, uri);
                                  startActivity(intent);
                                  return true;
                              } catch (Exception ignored) {}
                          }
                          return false;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          swipeRefresh.setRefreshing(false);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView webView, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (uploadMessage != null) uploadMessage.onReceiveValue(null);
                          uploadMessage = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(intent, FILE_CHOOSER_RESULT_CODE);
                          } catch (Exception e) {
                              uploadMessage = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  swipeRefresh.setOnRefreshListener(() -> webView.reload());

                  getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                      @Override
                      public void handleOnBackPressed() {
                          if (webView.canGoBack()) {
                              webView.goBack();
                          } else {
                              setEnabled(false);
                              getOnBackPressedDispatcher().onBackPressed();
                          }
                      }
                  });

                  webView.loadUrl(APP_URL);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, @Nullable Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_CHOOSER_RESULT_CODE && uploadMessage != null) {
                      Uri[] results = null;
                      if (resultCode == RESULT_OK && data != null) {
                          if (data.getDataString() != null) {
                              results = new Uri[]{Uri.parse(data.getDataString())};
                          } else if (data.getClipData() != null) {
                              int count = data.getClipData().getItemCount();
                              results = new Uri[count];
                              for (int i = 0; i < count; i++) {
                                  results[i] = data.getClipData().getItemAt(i).getUri();
                              }
                          }
                      }
                      uploadMessage.onReceiveValue(results);
                      uploadMessage = null;
                  }
              }
          }
          EOF

          # 9. Copy icons
          if [ -f "public/pwa-512x512.png" ]; then
              cp public/pwa-512x512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              cp public/pwa-512x512.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
              cp public/pwa-512x512.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
              cp public/pwa-512x512.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
              cp public/pwa-512x512.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          elif [ -f "public/pwa-192x192.png" ]; then
              cp public/pwa-192x192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
              cp public/pwa-192x192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
              cp public/pwa-192x192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
              cp public/pwa-192x192.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
              cp public/pwa-192x192.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify & Prepare APK
        id: prepare_apk
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Searching for APK in workspace..."
            FOUND=$(find . -name "*.apk" | head -n 1)
            if [ -n "$FOUND" ]; then
              APK_PATH="$FOUND"
            else
              echo "Error: app-debug.apk not found!"
              exit 1
            fi
          fi
          echo "APK generated at: $APK_PATH"
          mkdir -p release-asset
          cp "$APK_PATH" release-asset/app-debug.apk
          echo "apk_file=release-asset/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.prepare_apk.outputs.apk_file }}
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="JualRugi.my.id Debug APK v1.0.${{ github.run_number }}"
          gh release create "$TAG_NAME" "release-asset/app-debug.apk" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "### Unduh Aplikasi Android JualRugi.my.id
          - **File:** app-debug.apk
          - **Status:** Siap diinstall di HP Android (Debug Build)
          - **Versi:** Build #${{ github.run_number }}"

      - name: Report Download Link
        if: always()
        run: |
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"
          echo "### 📱 DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
          echo "Link Unduh APK Langsung:" >> "$GITHUB_STEP_SUMMARY"
          echo "[$DIRECT_URL]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "File cadangan 'app-debug-apk' juga dapat diunduh di tab Artifacts Actions." >> "$GITHUB_STEP_SUMMARY"
