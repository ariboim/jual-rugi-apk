    <path d="M120 180 C120 160 136 144 156 144 L310 144 L396 230 C406 240 406 256 396 266 L286 376 C276 386 260 386 250 376 L144 270 C128 254 120 234 120 210 Z" fill="#ffffff" />
    <circle cx="180" cy="200" r="22" fill="#0284c7"/>
