    <circle cx="340" cy="190" r="14" fill="#0284c7"/>
    <circle cx="220" cy="330" r="14" fill="#0284c7"/>
  </g>
  
  <!-- Brand text at bottom -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">JUALRUGI.ID</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="4">BUTUH UANG • COD</text>
